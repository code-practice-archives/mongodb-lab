services:

  config:
    image: mongo:8.0
    container_name: mongodb-lesson-10-config
    hostname: config

    ports:
      - "27031:27017"

    command:
      - mongod
      - --configsvr
      - --replSet
      - configRS
      - --port
      - "27017"
      - --bind_ip_all

    volumes:
      - config_data:/data/db


  shard1:
    image: mongo:8.0
    container_name: mongodb-lesson-10-shard1
    hostname: shard1

    ports:
      - "27032:27017"

    command:
      - mongod
      - --shardsvr
      - --replSet
      - shard1RS
      - --port
      - "27017"
      - --bind_ip_all

    volumes:
      - shard1_data:/data/db


  shard2:
    image: mongo:8.0
    container_name: mongodb-lesson-10-shard2
    hostname: shard2

    ports:
      - "27033:27017"

    command:
      - mongod
      - --shardsvr
      - --replSet
      - shard2RS
      - --port
      - "27017"
      - --bind_ip_all

    volumes:
      - shard2_data:/data/db


  mongos:
    image: mongo:8.0
    container_name: mongodb-lesson-10-mongos

    ports:
      - "27030:27017"

    command:
      - mongos
      - --configdb
      - configRS/config:27017
      - --port
      - "27017"
      - --bind_ip_all

    depends_on:
      - config
      - shard1
      - shard2


volumes:
  config_data:
  shard1_data:
  shard2_data: